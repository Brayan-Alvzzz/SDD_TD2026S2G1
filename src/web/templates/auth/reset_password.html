{% extends "base.html" %}

{% block title %}Restablecer Contraseña{% endblock %}

{% block content %}
<div class="card auth-card">
    <h1 class="card-title text-center">Restablecer Contraseña</h1>
    <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.5rem; text-align: center;">
        Ingrese y confirme su nueva contraseña (mínimo 8 caracteres).
    </p>

    <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
        <div class="form-group">
            <label for="password" class="form-label">Nueva Contraseña</label>
            <input type="password" id="password" name="password" class="form-input" required 
                   placeholder="Mínimo 8 caracteres" minlength="8" autofocus>
        </div>

        <div class="form-group">
            <label for="password_confirm" class="form-label">Confirmar Nueva Contraseña</label>
            <input type="password" id="password_confirm" name="password_confirm" class="form-input" required 
                   placeholder="Repita la nueva contraseña" minlength="8">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Actualizar Contraseña</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
        <a href="{{ url_for('auth.login_view') }}" style="color: var(--primary); font-weight: 500;">← Cancelar y volver al Inicio de Sesión</a>
    </div>
</div>
{% endblock %}
