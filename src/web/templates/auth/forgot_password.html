{% extends "base.html" %}

{% block title %}Recuperar Contraseña{% endblock %}

{% block content %}
<div class="card auth-card">
    <h1 class="card-title text-center">Recuperar Contraseña</h1>
    <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.5rem; text-align: center;">
        Ingrese su dirección de correo electrónico registrada para recibir un enlace de restablecimiento.
    </p>

    <form action="{{ url_for('auth.forgot_password') }}" method="POST">
        <div class="form-group">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" id="email" name="email" class="form-input" required 
                   value="{{ email or '' }}" placeholder="tu-correo@ejemplo.com" autofocus>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Enviar Enlace de Recuperación</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
        <a href="{{ url_for('auth.login_view') }}" style="color: var(--primary); font-weight: 500;">← Volver al Inicio de Sesión</a>
    </div>
</div>
{% endblock %}
