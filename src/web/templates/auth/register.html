{% extends "base.html" %}

{% block title %}Registrarse{% endblock %}

{% block content %}
<div class="card auth-card">
    <h1 class="card-title text-center">Crear Cuenta</h1>
    <form action="{{ url_for('auth.register') }}" method="POST">
        <div class="form-group">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" id="email" name="email" class="form-input" required 
                   value="{{ email or '' }}" placeholder="tu-correo@ejemplo.com" autofocus>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" name="password" class="form-input" required 
                   minlength="8" placeholder="Mínimo 8 caracteres">
            <p class="form-help">La contraseña debe tener al menos 8 caracteres.</p>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Registrarse</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
        ¿Ya tienes una cuenta? <a href="{{ url_for('auth.login_view') }}" style="color: var(--primary); font-weight: 500;">Inicia sesión aquí</a>
    </div>
</div>
{% endblock %}
